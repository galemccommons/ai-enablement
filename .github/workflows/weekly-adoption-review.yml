name: Weekly adoption review

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-review:
    runs-on: ubuntu-latest
    steps:
      - name: Create the weekly review issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `[Adoption Review] ${date}`;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            if (existing.some((issue) => issue.title === title)) {
              core.info(`Review issue already exists: ${title}`);
              return;
            }

            const pilots = existing.filter(
              (issue) =>
                !issue.pull_request &&
                issue.labels.some((label) =>
                  (typeof label === "string" ? label : label.name) === "adoption",
                ),
            );
            const pilotList =
              pilots.length === 0
                ? "No open adoption pilots are currently tracked."
                : pilots
                    .map(
                      (issue) =>
                        `- [ ] #${issue.number} ${issue.title} (@${issue.user.login})`,
                    )
                    .join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Review each open pilot and update its tracking issue with the current adoption percentage, blockers, and next step.\n\n${pilotList}\n\nUse the [adoption update template](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new?template=adoption-update.md) when a separate progress update is more useful.`,
            });
